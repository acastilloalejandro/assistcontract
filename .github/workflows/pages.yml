name: Deploy GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - run: test -f dist/index.html && test -f dist/sw.js && test -f dist/src/main.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar sitio público tras el deploy
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          if [[ -z "$base" ]]; then exit 1; fi
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 15 "$base/" -o /tmp/assistcontract-index.html \
              && grep -q 'src/main.js' /tmp/assistcontract-index.html \
              && curl --fail --silent --show-error --location --max-time 15 "$base/src/main.js" -o /tmp/assistcontract-main.js \
              && grep -q 'review-report.js' /tmp/assistcontract-main.js; then
              echo 'Página y módulo principal publicados correctamente.'
              exit 0
            fi
            echo "Intento $attempt: esperando actualización de GitHub Pages."
            sleep 10
          done
          echo 'El sitio público no sirve la versión esperada.' >&2
          exit 1
